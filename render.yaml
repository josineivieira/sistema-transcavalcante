databases:
  - name: transcavalcante-db
    databaseName: transcavalcante
    user: transcavalcante
    plan: free

services:
  - type: web
    name: transcavalcante-api
    runtime: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Transcavalcante
      - key: APP_URL
        value: https://sistema-transcavalcante-1.onrender.com
      - key: API_URL
        value: https://sistema-transcavalcante.onrender.com
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: transcavalcante-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: '["https://sistema-transcavalcante-1.onrender.com"]'
      - key: FISCAL_DEFAULT_PROVIDER
        value: mock
      - key: FISCAL_ENVIRONMENT
        value: homologation
      - key: ALLOW_MOCK_IN_PRODUCTION
        value: false
      - key: ENABLE_NFSE
        value: true
      - key: ENABLE_CTE
        value: true
      - key: ENABLE_MDFE
        value: false
      - key: NFSE_BASE_URL
        sync: false
      - key: FISCAL_CERTIFICATE_PASSWORD
        sync: false

  - type: web
    name: transcavalcante-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_APP_NAME
        value: Transcavalcante
      - key: VITE_API_URL
        value: https://sistema-transcavalcante.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
